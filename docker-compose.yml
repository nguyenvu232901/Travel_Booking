version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: travel_booking_db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: travel_booking
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - travel_booking_network

  # Backend API
  backend:
    build:
      context: ./tour-management/backend
      dockerfile: Dockerfile
    container_name: travel_booking_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 8000
      MONGO_URI: mongodb://admin:password123@mongodb:27017/travel_booking?authSource=admin
      JWT_SECRET_KEY: your_jwt_secret_key_here
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    volumes:
      - ./tour-management/backend:/app
      - /app/node_modules
    networks:
      - travel_booking_network

  # Frontend React App
  frontend:
    build:
      context: ./tour-management/frontend
      dockerfile: Dockerfile
    container_name: travel_booking_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - travel_booking_network

  # MongoDB Admin Interface (optional)
  mongo-express:
    image: mongo-express:latest
    container_name: travel_booking_mongo_express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    ports:
      - "8082:8081"
    depends_on:
      - mongodb
    networks:
      - travel_booking_network

volumes:
  mongodb_data:

networks:
  travel_booking_network:
    driver: bridge
